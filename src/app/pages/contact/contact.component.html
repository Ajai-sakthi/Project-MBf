<div class="contact-container">
  <h1>Contact Us</h1>
  <p>We’d love to hear from you! Please reach out for any inquiries, feedback, or support.</p>

  <h2>Contact Information</h2>
  <p><strong>Email:</strong> support&#64;cineparadiso.com</p>
  <p><strong>Phone:</strong> +1 (123) 456-7890</p>
  <p>Or fill out our <a href="mailto:support@cineparadiso.com">contact form</a> to send us a message directly.</p>

  <h2>Contact Form</h2>
  <form id="contact-form">
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required />
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />
    </div>

    <div class="form-group">
      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>

    <button type="submit">Send Message</button>
  </form>
</div>
